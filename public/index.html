<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal IP Monitor</title>
    <style>
        body { font-family: monospace; background: #121212; color: #00ff00; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { border-bottom: 1px solid #00ff00; padding-bottom: 10px; }
        button { background: #00ff00; color: #121212; border: none; padding: 10px 15px; cursor: pointer; font-weight: bold; font-family: monospace; }
        button:hover { background: #00cc00; }
        .log-entry { background: #1e1e1e; border: 1px solid #333; padding: 10px; margin-top: 10px; border-radius: 4px; }
        .time { color: #888; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📡 IP Connection Dashboard</h1>
        <p>Opening this page automatically tests and logs your current IP connection.</p>
        <button onclick="refreshLogs()">🔄 Refresh Log History</button>
        
        <div id="logs" style="margin-top: 20px;">Loading history...</div>
    </div>

    <script>
        // 1. Immediately log our own visit upon opening
        fetch('/api/log', { method: 'POST' })
            .then(() => refreshLogs());

        // 2. Fetch the history from the serverless function
        function refreshLogs() {
            fetch('/api/log')
                .then(res => res.json())
                .then(data => {
                    const logsDiv = document.getElementById('logs');
                    if (!data.logs || data.logs.length === 0) {
                        logsDiv.innerHTML = "<p>No visitor logs recorded yet.</p>";
                        return;
                    }
                    logsDiv.innerHTML = data.logs.map(log => `
                        <div class="log-entry">
                            <strong>IP Address:</strong> ${log.ip} <br>
                            <span class="time">🕒 ${new Date(log.time).toLocaleString()}</span><br>
                            <small style="color: #aaa;">Browser: ${log.userAgent}</small>
                        </div>
                    `).join('');
                })
                .catch(err => {
                    document.getElementById('logs').innerText = "Error loading logs.";
                });
        }
    </script>
</body>
</html>
